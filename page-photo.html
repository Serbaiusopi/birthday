<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تبریک تولد</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <!-- ===== کتابخانه کانفتی ===== -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        /* ===== جلوگیری از سفید شدن ===== */
        html {
            background-color: #000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: 'Vazir', 'IRANSans', 'Tahoma', sans-serif;
            background-color: #000;
            direction: rtl;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        /* ========== ستاره‌های پس‌زمینه ========== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #FFF;
            border-radius: 50%;
            box-shadow: 0 0 8px #FFF, 0 0 15px #FFF, 0 0 25px #FFF, 0 0 35px #00FFFF, 0 0 45px #00FFFF;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.9;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* ========== کادر شیشه‌ای ========== */
        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 3px;
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 25px;
            padding: 35px 20px 50px 20px;
            width: 98%;
            max-width: 550px;
            height: 99%;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.7);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 0 60px rgba(255, 215, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        /* ========== اسم هنری ========== */
        .name-box {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            width: 100%;
            padding: 5px 15px;
            text-align: center;
            z-index: 5;
        }

        .name-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2em;
            font-weight: bold;
            background: linear-gradient(to right, #ffd700, #ffaa00, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 4s ease-in-out infinite;
            letter-spacing: 4px;
            padding: 5px 0;
            line-height: 1.2;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.2));
        }

        @keyframes shine {
            0% {
                background-position: 0% center;
            }

            50% {
                background-position: 200% center;
            }

            100% {
                background-position: 0% center;
            }
        }

        .name-sub {
            font-family: 'Playfair Display', serif;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75em;
            letter-spacing: 4px;
            margin-top: 2px;
            font-weight: 300;
            text-transform: lowercase;
        }

        /* ========== عکس با نوار موجی ========== */
        .photo-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 10px auto;
            flex-shrink: 0;
            border-radius: 20px;
        }

        /* ===== نوار با افکت موج (Wave Border) ===== */
        .rotating-border {
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 23px;
            background: linear-gradient(90deg,
                    #00b4ff,
                    #7fc8d6,
                    #ffd700,
                    #2ecc71,
                    #00b4ff,
                    #7fc8d6,
                    #ffd700,
                    #2ecc71,
                    #00b4ff);
            background-size: 300% 100%;
            animation: waveBorder 3s ease-in-out infinite;
            z-index: 0;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 3px;
        }

        @keyframes waveBorder {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* ===== درخشش اضافی ===== */
        .rotating-border::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 25px;
            background: linear-gradient(90deg,
                    rgba(0, 180, 255, 0.2),
                    rgba(127, 200, 214, 0.2),
                    rgba(255, 215, 0, 0.2),
                    rgba(46, 204, 113, 0.2),
                    rgba(0, 180, 255, 0.2));
            background-size: 300% 100%;
            animation: waveBorder 3s ease-in-out infinite;
            filter: blur(8px);
            z-index: -1;
            opacity: 0.5;
        }

        .photo-container {
            width: 100%;
            max-width: 320px;
            height: auto;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .photo-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* ========== متن زیر عکس ========== */
        .photo-caption {
            font-family: 'Dancing Script', cursive;
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            padding: 0 15px;
            line-height: 1.8;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
            margin-top: -5px;
        }

        /* ========== ناوبری ========== */
        .nav-bar {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 20;
            background: transparent;
            padding: 8px 20px;
            border-radius: 50px;
            width: fit-content;
            margin: 0 auto;
        }

        .nav-arrow {
            background: none;
            border: none;
            font-size: 1.4em;
            color: white;
            cursor: pointer;
            padding: 5px 10px;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-arrow:active {
            transform: scale(0.9);
        }

        .page-dots {
            display: flex;
            gap: 10px;
        }

        .dot {
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.5);
        }

        .dot.active {
            color: #ffd700;
            text-shadow: 0 0 5px #ffd700;
            transform: scale(1.2);
            display: inline-block;
        }

        .dot:active {
            transform: scale(0.9);
        }

        button,
        .nav-arrow {
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        /* ========== ریسپانسیو ========== */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            .glass-card {
                padding: 20px 12px;
                gap: 12px;
            }

            .nav-bar {
                bottom: 25px;
                gap: 10px;
                padding: 5px 12px;
            }

            .nav-arrow {
                font-size: 1.2em;
            }

            .dot {
                font-size: 1em;
            }

            .name-title {
                font-size: 2.5em;
                letter-spacing: 3px;
            }

            .name-sub {
                font-size: 1.1em;
                letter-spacing: 3px;
            }

            .photo-wrapper {
                max-width: 260px;
            }

            .photo-container {
                max-width: 260px;
            }

            .photo-caption {
                font-size: 1em;
            }

            .rotating-border {
                top: -5px;
                left: -5px;
                right: -5px;
                bottom: -5px;
                border-radius: 19px;
                padding: 2.5px;
            }
        }

        @media (max-width: 480px) {
            .name-title {
                font-size: 2em;
                letter-spacing: 2px;
            }

            .name-sub {
                font-size: 1em;
            }

            .photo-wrapper {
                max-width: 240px;
            }

            .photo-container {
                max-width: 240px;
            }

            .photo-caption {
                font-size: 1em;
            }

            .rotating-border {
                top: -4px;
                left: -4px;
                right: -4px;
                bottom: -4px;
                border-radius: 17px;
                padding: 1.5px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== ستاره‌های پس‌زمینه ===== -->
    <div class="stars" id="starsContainer"></div>

    <div class="container">
        <div class="glass-card">

            <!-- ===== اسم هنری ===== -->
            <div class="name-box">
                <div class="name-title">Reyhaneh</div>
                <div class="name-sub">From fatemeh and Mahdi</div>
            </div>

            <!-- ===== عکس با نوار موجی ===== -->
            <div class="photo-wrapper">
                <div class="rotating-border"></div>
                <div class="photo-container">
                    <img src="./assets/photo_2026-09-03_01-38-54.jpg" alt="تولدت مبارک ریحانه">
                </div>
            </div>

            <!-- ===== متن زیر عکس ===== -->
            <div class="photo-caption">
                ببین تولد کیه 🥺🎂<br>
                ریحانِ عزیزم متاسفانه دوریم و نمیتونیم تو این روز خاص کنارت باشیم ولی دلیل نمیشه که تلاشمونو نکنیم تا
                خوش‌حالت کنیم کهه😌<br>
                امیدوارم که این هدیه کوچیک یه لبخند رو لبای قشنگت بیاره و بدونی که چقدر برامون عزیزی و دوستت داریم🫂💙
            </div>

        </div>
    </div>

    <!-- ===== ناوبری ===== -->
    <div class="nav-bar">
        <button class="nav-arrow" id="prevPage">❮</button>
        <div class="page-dots">
            <span class="dot" data-page="1">○</span>
            <span class="dot" data-page="2">○</span>
            <span class="dot active" data-page="photo">●</span>
        </div>
        <button class="nav-arrow" id="nextPage">❯</button>
    </div>

    <script>
        // ============================================================
        //  1. تنظیم ستاره‌ها
        // ============================================================
        function setupStars() {
            const starsContainer = document.getElementById('starsContainer');
            const numberOfStars = 125;
            starsContainer.innerHTML = '';
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                const minSize = 1.5;
                const maxSize = 4;
                const starSize = Math.random() * (maxSize - minSize) + minSize;
                star.style.width = `${starSize}px`;
                star.style.height = `${starSize}px`;
                const twinkleDuration = Math.random() * 3 + 1;
                star.style.animationDuration = `${twinkleDuration}s`;
                starsContainer.appendChild(star);
            }
        }

        // ============================================================
        //  2. کانفتی (کاغذ رنگی)
        // ============================================================
        function launchConfetti() {
            confetti({
                particleCount: 100,
                spread: 80,
                origin: { x: 0, y: 0.7 },
                colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8800', '#ffd700']
            });

            setTimeout(() => {
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { x: 1, y: 0.7 },
                    colors: ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#ffd700', '#5f27cd']
                });
            }, 200);

            setTimeout(() => {
                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { x: 0, y: 0.6 },
                    colors: ['#ff9f43', '#00d2d3', '#54a0ff', '#ff1493']
                });
            }, 400);

            setTimeout(() => {
                confetti({
                    particleCount: 70,
                    spread: 60,
                    origin: { x: 1, y: 0.6 },
                    colors: ['#ff6348', '#7bed9f', '#70a1ff', '#e056fd']
                });
            }, 600);
        }

        // ============================================================
        //  3. نمایش نرم صفحه
        // ============================================================
        window.addEventListener('load', function () {
            document.body.style.opacity = '1';
            setTimeout(launchConfetti, 500);
        });

        // ============================================================
        //  4. ناوبری (۳ صفحه) - حالت برعکس
        // ============================================================
        const pages = ['page-photo.html', 'First-page.html', 'page2.html'];
        const currentPage = 1;

        function goToPage(pageNum) {
            if (pageNum >= 1 && pageNum <= pages.length) {
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = pages[pageNum - 1];
                }, 600);
            }
        }

        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage < pages.length) {
                goToPage(currentPage + 1);
            } else {
                goToPage(1);
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage > 1) {
                goToPage(currentPage - 1);
            } else {
                goToPage(pages.length);
            }
        });

        document.querySelectorAll('.dot').forEach(dot => {
            dot.addEventListener('click', () => {
                const page = dot.dataset.page;
                if (page === 'photo') {
                    return;
                } else if (page === '1') {
                    goToPage(2);
                } else if (page === '2') {
                    goToPage(3);
                }
            });
        });

        // ============================================================
        //  5. اجرا
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            setupStars();
            window.addEventListener('resize', setupStars);
        });
    </script>

</body>

</html>
