<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>راهنما</title>
    <style>
        body {
            font-family: 'Vazir', 'IRANSans', 'Tahoma', sans-serif;
            background-color: #000;
            direction: rtl;
            opacity: 0;
            animation: pageFadeIn 1.5s ease-in-out forwards;
        }

        @keyframes pageFadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #000;
            direction: rtl;
        }

        /* ستاره‌های پس‌زمینه */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #FFF;
            border-radius: 50%;
            box-shadow: 0 0 8px #FFF, 0 0 15px #FFF, 0 0 25px #FFF, 0 0 35px #00FFFF, 0 0 45px #00FFFF;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.9;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* کانتینر اصلی */
        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            padding: 10px;
        }

        /* کادر شیشه‌ای */
        .glass-card {
            background: rgba(0, 0, 0, 0.674);
            padding: 40px 30px;
            width: 100%;
            height: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: auto;
        }

        /* عنوان */
        .title {
            color: white;
            font-size: 1.8em;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* لیست نکات */
        .tips-list {
            text-align: right;
            margin-bottom: 25px;
            width: 100%;
        }

        .tip-item {
            color: white;
            font-size: 1.1em;
            line-height: 2.2;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tip-icon {
            font-size: 1.4em;
            min-width: 40px;
        }

        .tip-text {
            text-align: right;
        }

        /* ===== سه گزینه عددی ===== */
        .question-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1em;
            margin-bottom: 15px;
            font-weight: 300;
        }

        .options-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 350px;
        }

        .option-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 2.2em;
            font-weight: bold;
            font-family: 'Tahoma', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
        }

        .option-btn:hover {
            transform: scale(1.05);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        /* رنگ‌های مختلف برای هر گزینه */
        .option-btn.option-1 {
            border-color: rgba(0, 180, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 180, 255, 0.1);
        }

        .option-btn.option-1:hover {
            border-color: #00b4ff;
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.3);
            background: rgba(0, 180, 255, 0.1);
        }

        .option-btn.option-2 {
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .option-btn.option-2:hover {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.1);
        }

        .option-btn.option-3 {
            border-color: rgba(46, 204, 113, 0.4);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.1);
        }

        .option-btn.option-3:hover {
            border-color: #2ecc71;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.3);
            background: rgba(46, 204, 113, 0.1);
        }

        /* پیام خطا/درستی */
        .feedback-message {
            color: #ff4444;
            font-size: 0.95em;
            height: 30px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feedback-message.show {
            opacity: 1;
        }

        .feedback-message.success {
            color: #2ecc71;
        }

        .feedback-message.wrong {
            color: #ff4444;
        }

        /* استایل موبایل */
        @media (max-width: 768px) {
            .glass-card {
                padding: 25px 20px;
            }

            .title {
                font-size: 1.5em;
            }

            .tip-item {
                font-size: 0.95em;
                line-height: 2;
            }

            .tip-icon {
                font-size: 1.2em;
                min-width: 35px;
            }

            .option-btn {
                width: 70px;
                height: 70px;
                font-size: 1.8em;
            }

            .options-container {
                gap: 15px;
            }

            .question-text {
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            .option-btn {
                width: 60px;
                height: 60px;
                font-size: 1.5em;
            }

            .options-container {
                gap: 12px;
            }

            .title {
                font-size: 1.3em;
            }
        }
    </style>
</head>

<body>
    <div class="stars" id="starsContainer"></div>

    <div class="container">
        <div class="glass-card">
            <div class="title">🔐 راهنما ورود</div>

            <div class="tips-list">
                <div class="tip-item">
                    <span class="tip-icon">📖</span>
                    <span class="tip-text">این سایت 3 صفحه داره</span>
                </div>
                <div class="tip-item">
                    <span class="tip-icon">💎</span>
                    <span class="tip-text">پایین هر صفحه، دکمه قبلی و بعدی کمکت می‌کنه تا بین صفحات جابه جا بشی</span>
                </div>
                <div class="tip-item">
                    <span class="tip-icon">🎯</span>
                    <span class="tip-text">عدد درست رو انتخاب کن تا وارد بشی</span>
                </div>
            </div>

            <!-- ===== سوال و گزینه‌ها ===== -->
            <div class="options-container">
                <button class="option-btn option-1" data-value="87">87</button>
                <button class="option-btn option-2" data-value="88">88</button>
                <button class="option-btn option-3" data-value="89">89</button>
            </div>

            <div class="feedback-message" id="feedbackMessage"></div>

        </div>
    </div>

    <script>
        // ========== تنظیم ستاره‌ها ==========
        function setupStars() {
            const starsContainer = document.getElementById('starsContainer');
            const numberOfStars = 125;
            starsContainer.innerHTML = '';
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                const minSize = 1.5;
                const maxSize = 4;
                const starSize = Math.random() * (maxSize - minSize) + minSize;
                star.style.width = `${starSize}px`;
                star.style.height = `${starSize}px`;
                const twinkleDuration = Math.random() * 3 + 1;
                star.style.animationDuration = `${twinkleDuration}s`;
                starsContainer.appendChild(star);
            }
        }

        // ========== گزینه‌ها ==========
        // 🔑 عدد درست رو اینجا تنظیم کن
        const CORRECT_ANSWER = 88;

        const options = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedbackMessage');

        options.forEach(btn => {
            btn.addEventListener('click', function () {
                const selectedValue = parseInt(this.dataset.value);

                if (selectedValue === CORRECT_ANSWER) {
                    // ✅ درست
                    feedback.className = 'feedback-message show success';
                    feedback.textContent = '✅ آفرین! درست حدس زدی! 🎉';

                    // غیرفعال کردن دکمه‌ها
                    options.forEach(b => b.style.pointerEvents = 'none');

                    // محو شدن و رفتن به صفحه بعد
                    setTimeout(() => {
                        document.querySelector('.glass-card').style.transition = 'opacity 0.6s ease-out';
                        document.querySelector('.glass-card').style.opacity = '0';
                        setTimeout(() => {
                            window.location.href = 'page-photo.html';
                        }, 600);
                    }, 800);

                } else {
                    // ❌ اشتباه
                    feedback.className = 'feedback-message show wrong';
                    feedback.textContent = '❌ نه! دوباره امتحان کن 😊';

                    // افکت خطا روی دکمه
                    this.style.transform = 'scale(0.85)';
                    this.style.borderColor = '#ff4444';
                    this.style.boxShadow = '0 0 30px rgba(255, 68, 68, 0.3)';

                    setTimeout(() => {
                        this.style.transform = 'scale(1)';
                        this.style.borderColor = '';
                        this.style.boxShadow = '';
                    }, 500);

                    // پاک کردن پیام خطا بعد از 2 ثانیه
                    setTimeout(() => {
                        feedback.className = 'feedback-message';
                    }, 2000);
                }
            });
        });

        // ========== اجرای اولیه ==========
        document.addEventListener('DOMContentLoaded', () => {
            setupStars();
            window.addEventListener('resize', setupStars);
        });
    </script>
</body>

</html>
